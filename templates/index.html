<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI-Based PACS System</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
          rel="stylesheet">

    <style>

        body {

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );

            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .card {

            border: none;

            border-radius: 20px;

            padding: 40px;

            width: 100%;

            max-width: 650px;

            background: white;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .title {

            text-align: center;

            font-weight: 600;

            color: #1e3a8a;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: gray;

            margin-bottom: 30px;
        }

        .upload-box {

            border: 2px dashed #1e3a8a;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

            background: #f8fafc;

            margin-bottom: 20px;
        }

        .btn-custom {

            width: 100%;

            background: #1e3a8a;

            color: white;

            font-weight: 600;

            border-radius: 10px;

            padding: 12px;

            transition: 0.3s;
        }

        .btn-custom:hover {

            background: #2563eb;
        }

        .result-box {

            margin-top: 30px;

            padding: 20px;

            border-radius: 15px;

            background: #eff6ff;

            text-align: center;
        }

        .prediction {

            font-size: 28px;

            font-weight: bold;

            color: #dc2626;
        }

        .filename {

            color: gray;

            margin-top: 10px;
        }

        .icon {

            font-size: 60px;

            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1 class="title">
            🩺 AI-Based PACS System
        </h1>

        <p class="subtitle">
            Pneumonia Detection using Deep Learning
        </p>

        <form action="/predict"
              method="post"
              enctype="multipart/form-data">

            <div class="upload-box">

                <div class="icon">
                    🫁
                </div>

                <input class="form-control"
                       type="file"
                       name="file"
                       required>

            </div>

            <button class="btn btn-custom"
                    type="submit">

                Upload & Predict

            </button>

        </form>

     {% if prediction %}

<div class="result-box">

    <h3>
        Prediction Result
    </h3>

    <!-- Image Preview -->
    <img src="{{ image_path }}"
         width="300"
         class="img-fluid rounded shadow mb-3">

    <div class="prediction">

        {{ prediction }}

    </div>
<h5 style="margin-top:15px;
color:#2563eb;">

Confidence:
{{confidence}}%

</h5>

    <div class="filename">

        Uploaded File:
        {{ filename }}

    </div>

</div>

{% endif %}

    </div>

</body>

</html>
